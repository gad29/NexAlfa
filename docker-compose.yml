services:
  # ── Backend: Agent + Gateway ──────────────────────────────
  nexalfa:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: nexalfa-agent
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - ./workspace:/app/workspace
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
      - agent-reach-data:/root/.agent-reach
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nexnet

  # ── Frontend: Next.js Web App ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: "${NEX_PUBLIC_URL:-http://localhost:18789}"
    container_name: nexalfa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      nexalfa:
        condition: service_healthy
    networks:
      - nexnet

  # ── Reverse Proxy: Nginx + SSL ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexalfa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - nexalfa
      - web
    networks:
      - nexnet

  # ── SSL: Certbot (Let's Encrypt) ──────────────────────────
  certbot:
    image: certbot/certbot
    container_name: nexalfa-certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  agent-reach-data:

networks:
  nexnet:
    driver: bridge
