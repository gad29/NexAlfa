services:
  # ── Backend: Agent + Gateway ──────────────────────────────
  nexalfa:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: nexalfa-agent
    restart: unless-stopped
    volumes:
      - ./workspace:/app/workspace
      - ./storage:/app/storage
      - agent-reach-data:/root/.agent-reach
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nexnet

  # ── Frontend: Next.js Web App ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: "${NEX_PUBLIC_URL:-http://localhost:18789}"
    container_name: nexalfa-web
    restart: unless-stopped
    depends_on:
      nexalfa:
        condition: service_healthy
    networks:
      - nexnet

  # ── Internal Router: Nginx (Coolify handles SSL) ──────────
  nginx:
    image: nginx:alpine
    container_name: nexalfa-router
    restart: unless-stopped
    # Expose port 80 to Coolify's proxy
    ports:
      - "80"
    volumes:
      - ./deploy/nginx-coolify.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexalfa
      - web
    networks:
      - nexnet

volumes:
  agent-reach-data:

networks:
  nexnet:
    driver: bridge
