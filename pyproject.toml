[project]
name = "nexalfa"
version = "0.1.0"
description = "NexAlfa — Your personal AI agent. No guardrails. Self-improving. Always on."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Core AI
    "litellm>=1.40.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    # Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.11.0",
    "websockets>=13.0",
    # Memory & Storage
    "chromadb>=0.5.0",
    "aiosqlite>=0.20.0",
    # Tools
    "playwright>=1.45.0",
    "apscheduler>=3.10.0",
    # Channel Adapters
    "python-telegram-bot>=22.0",
    "discord.py>=2.4.0",
    "slack-sdk>=3.30.0",
    "aiohttp>=3.9.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "httpx>=0.27.0",
    # CLI
    "rich>=13.7.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    # Config
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # MCP
    "mcp>=1.0.0",
    # Auth
    "pyjwt[crypto]>=2.8.0",
    # Utilities
    "jinja2>=3.1.0",
    "markdown>=3.6",
    "python-dateutil>=2.9.0",
    "uuid7>=0.1.0",
    # Document Processing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.0.0",
    # Web Scraping & Search
    "duckduckgo-search>=6.0.0",
    "trafilatura>=1.10.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
all = [
    "nexalfa[dev]",
]

[project.scripts]
nexalfa = "cli.main:cli"
nex = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "gateway", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
